<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>not yet built — OIKOS</title>
<style>
  :root {
    --stone:     #0d0c0a;
    --parchment: #e8e0d2;
    --gold:      #c9a45c;
    --rust:      #8a4b32;
    --dim:       #6b6354;
    --line:      #2a2620;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--stone);
    color: var(--parchment);
    font-family: "Hoefler Text", "Iowan Old Style", Baskerville, "Palatino Linotype", Palatino, Georgia, serif;
    display: grid;
    place-items: center;
    /* the faintest vignette — lamplight in a dark hall */
    box-shadow: inset 0 0 22vmax rgba(0,0,0,.55);
  }

  main {
    text-align: center;
    padding: 3rem 1.5rem;
    animation: settle 1.1s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(0.6rem); }
    to   { opacity: 1; transform: none; }
  }

  /* an empty doorway, drawn in one gold line */
  .door {
    width: 72px;
    height: 112px;
    margin: 0 auto 2.75rem;
    border: 1px solid rgba(201,164,92,.45);
    border-radius: 36px 36px 0 0;
    border-bottom-color: var(--gold);
    position: relative;
  }
  .door::after {           /* threshold stone */
    content: "";
    position: absolute;
    left: -16px; right: -16px; bottom: -1px;
    border-bottom: 1px solid rgba(201,164,92,.45);
  }

  .status {
    font-size: .72rem;
    letter-spacing: .42em;
    text-indent: .42em;     /* re-center the letterspaced line */
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.4rem;
  }

  h1 {
    font-weight: 400;
    font-style: italic;
    font-size: clamp(1.7rem, 5vw, 2.4rem);
    letter-spacing: .015em;
    margin-bottom: 1.6rem;
  }

  .word {
    color: var(--dim);
    font-size: .95rem;
    line-height: 1.7;
    max-width: 30rem;
    margin: 0 auto;
  }
  .word .app { color: var(--parchment); }

  footer {
    position: fixed;
    bottom: 2rem;
    left: 0; right: 0;
    text-align: center;
    font-size: .66rem;
    letter-spacing: .5em;
    text-indent: .5em;
    text-transform: uppercase;
    color: var(--line);
  }
</style>
</head>
<body>
  <main>
    <div class="door" aria-hidden="true"></div>
    <p class="status">404 · no release here</p>
    <h1>this room is not yet built</h1>
    <p class="word">
      Nothing is deployed at <span class="app" id="addr">this address</span>.<br>
      When a release is set, the door will open.
    </p>
  </main>
  <footer>oikos</footer>
  <script>
    (function () {
      var h = location.hostname.split(".")[0];
      if (h) document.getElementById("addr").textContent = h + ".localhost";
    })();
  </script>
</body>
</html>
